 <div class="article-body"><p class="lead">${essayLeads[activeWord]}</p><p>Reading is one way of learning to notice. We follow a sentence, pause at an unfamiliar word, and slowly begin to see the world through someone else’s eyes. The smallest detail can change the meaning of everything around it.</p><p class="secondary">There is a particular pleasure in understanding something that was, a moment ago, just beyond our reach. A word becomes a thought; a thought becomes a connection. Then the page opens up again.</p><div class="article-rule"></div><h2>A little room for curiosity</h2><p>Attention does not always ask us to do more. Sometimes it asks us to stay with a small question for a little longer, without losing the thread of what we were doing.</p><p class="secondary">The best tools leave room for that curiosity. They offer what we need in the moment, then let us return to the things that matter.</p></div>`:`

 <div class="article-body"><p class="lead">${paperLeads[activeWord]}</p><p>At an interface between two media, the phase and amplitude of a light wave depend on the material properties and the local structure. By changing the arrangement of individual elements, it is possible to shape the emerging wavefront.</p><p class="secondary">A complete description must account for both the local response of each element and its interaction with neighboring structures. These effects become especially important when the separation is smaller than the wavelength of incident light.</p><div class="figure-note">READING SAMPLE<br>This excerpt is illustrative text for comparing the dictionary interface.</div><h2>From local response to wavefront control</h2><p>The resulting field can be studied through a combination of analytical models and numerical calculations. Together, they provide a useful picture of how a designed surface redirects energy.</p></div>`;
 anchorRect=null;
}
function senseMarkup(sense,index,kind){return kind==='folio'?`<div class="definition"><span class="sense-number">${String(index+1).padStart(2,'0')}</span><div><span class="pos">${sense[0]}</span><div class="definition-text">${sense[1]}</div></div></div>`:`<div class="definition"><span class="pos">${sense[0]}</span><div class="definition-text">${sense[1]}</div></div>`;}
function renderCard(kind,index){
 const note=notes[index];document.getElementById('note-index').textContent=String(index+1).padStart(2,'0');
 for(const key of ['title','description','width','material','density'])document.getElementById('note-'+key).textContent=note[key];
 const entry=entries[activeWord],isFolio=kind==='folio';open=true;
 const phrases=entry.phrases.map(pair=>kind==='mist'?`<div class="phrase-row"><div><div class="phrase-english">${pair[0]}</div><div class="phrase-chinese">${pair[1]}</div></div></div>`:`<div class="phrase-row"><span class="phrase-english">${pair[0]}</span><span class="phrase-chinese">${pair[1]}</span></div>`).join('');
 const motionClass=animateNext?' enter':'';animateNext=false;
 requestAnimationFrame(()=>{positionCard();document.querySelector('.lookup-word')?.classList.add('selected');});
 return `<section class="dictionary ${kind}${motionClass}" role="dialog" aria-modal="false" aria-labelledby="card-word"><button class="card-close" aria-label="关闭词典">${closeIcon}</button><div class="card-main"><div class="card-head">${isFolio?'<div class="entry-label">ENGLISH — 简明英汉</div>':''}<h2 class="headword" id="card-word">${entry.word}</h2><div class="pronunciation"><span class="phonetic">${entry.phonetic}</span></div></div><div class="definitions">${entry.senses.map((s,i)=>senseMarkup(s,i,kind)).join('')}${entry.extra?`<div class="extra-definitions" id="extra-definitions" hidden>${entry.extra.map((s,i)=>senseMarkup(s,i+entry.senses.length,kind)).join('')}</div><button class="more" aria-expanded="false" aria-controls="extra-definitions">更多释义 <span aria-hidden="true">＋</span></button>`:''}</div><div class="phrase-section"><div class="section-label">常用词组${isFolio?' / PHRASES':''}</div><div class="phrase-list">${phrases}</div></div></div><footer class="card-bottom"><span>英 → 简体中文</span><span><kbd>esc</kbd> 收起</span></footer></section>`;
}
const variants=[()=>renderCard('quiet',0),()=>renderCard('folio',1),()=>renderCard('mist',2)];
const initialUrl=new URL(location);const initialVariant=Number(initialUrl.searchParams.get('v')||2);
if(!Number.isInteger(initialVariant)||initialVariant<1||initialVariant>variants.length){initialUrl.searchParams.set('v','2');history.replaceState(null,'',initialUrl);}
// `variants` is an array of render functions, one per variant, in picker order.
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 2) - 1);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
function positionCard(){
 const card=stage.firstElementChild;if(!card)return;
 const anchor=anchorRect||document.querySelector('.lookup-word').getBoundingClientRect();
 card.style.maxHeight='';
 const viewportWidth=document.documentElement.clientWidth;
 card.style.maxWidth=(viewportWidth-24)+'px';
 const width=card.offsetWidth;let height=card.offsetHeight;
 const margin=Math.max(12,document.querySelector('.lab-bar').getBoundingClientRect().bottom+12),bottomLimit=innerHeight-80;
 let left=Math.max(12,Math.min(anchor.left-18,viewportWidth-width-12));
 let top=anchor.bottom+10,origin='top left';
 if(top+height>bottomLimit){
   if(anchor.top-height-10>=margin){top=anchor.top-height-10;origin='bottom left';}
   else if(anchor.right+12+width<=viewportWidth-12){left=anchor.right+12;top=Math.max(margin,Math.min(anchor.top,bottomLimit-height));origin='left center';}
   else if(anchor.left-12-width>=12){left=anchor.left-12-width;top=Math.max(margin,Math.min(anchor.top,bottomLimit-height));origin='right center';}
   else{
     const aboveRoom=anchor.top-10-margin,belowRoom=bottomLimit-anchor.bottom-10;
     const above=aboveRoom>belowRoom,room=Math.max(100,above?aboveRoom:belowRoom);
     card.style.maxHeight=Math.floor(Math.min(room,bottomLimit-margin))+'px';
     height=card.offsetHeight;
     top=above?Math.max(margin,anchor.top-height-10):Math.max(margin,Math.min(anchor.bottom+10,bottomLimit-height));
     origin=above?'bottom left':'top left';
   }
 }
 stage.style.left=Math.round(left)+'px';stage.style.top=Math.round(top)+'px';
 card.style.setProperty('--origin',origin);
}
function closeCard(){stage.innerHTML='';open=false;document.querySelector('.lookup-word')?.classList.remove('selected');}
function showCard(){animateNext=true;mount(current);}
function showStatus(message){const status=document.getElementById('status-message');status.textContent=message;status.hidden=false;clearTimeout(statusTimer);statusTimer=setTimeout(()=>status.hidden=true,3000);}
document.getElementById('word-select').addEventListener('change',e=>{activeWord=e.target.value;renderReading();showCard();});
document.getElementById('scene').addEventListener('change',e=>{activeScene=e.target.value;renderReading();showCard();});
document.getElementById('theme-toggle').addEventListener('click',e=>{const button=e.currentTarget,dark=document.body.dataset.theme!=='dark';document.body.dataset.theme=dark?'dark':'light';button.setAttribute('aria-pressed',String(dark));button.setAttribute('aria-label',dark?'切换浅色背景':'切换深色背景');button.querySelector('span').textContent=dark?'浅色':'深色';});
document.getElementById('reopen').addEventListener('click',()=>{anchorRect=null;showCard();});
reading.addEventListener('click',e=>{if(e.target.closest('.lookup-word')){anchorRect=null;showCard();}});
stage.addEventListener('click',e=>{if(e.target.closest('.card-close'))closeCard();const more=e.target.closest('.more');if(more){const expanded=more.getAttribute('aria-expanded')==='true';more.setAttribute('aria-expanded',String(!expanded));document.getElementById('extra-definitions').hidden=expanded;more.innerHTML=expanded?'更多释义 <span aria-hidden="true">＋</span>':'收起释义 <span aria-hidden="true">−</span>';positionCard();}});
document.addEventListener('pointerdown',e=>{if(open&&!e.target.closest('#stage,.lookup-word,.lab-bar,.proto-picker,.design-note'))closeCard();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeCard();return;}if(e.key!=='Enter'||e.altKey||e.ctrlKey||e.metaKey||e.target.closest('button,input,select,textarea')||e.target.isContentEditable)return;const selection=window.getSelection(),word=selection.toString().trim().toLowerCase();if(!word)return;e.preventDefault();if(entries[word]){activeWord=word;document.getElementById('word-select').value=word;anchorRect=selection.getRangeAt(0).getBoundingClientRect();showCard();}else showStatus('此 demo 内置 resonate、throughout、run 三个示例词条。');});
picker.addEventListener('click',e=>{if(e.target.closest('.proto-picker-replay'))animateNext=true;});
document.addEventListener('keydown',e=>{if((e.key==='r'||e.key==='R')&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!e.target.closest('input,textarea,select')&&!e.target.isContentEditable)animateNext=true;});
window.addEventListener('resize',()=>{anchorRect=null;if(open)positionCard();});
window.addEventListener('scroll',()=>{if(open){anchorRect=null;positionCard();}},{passive:true});
renderReading();
</script>
